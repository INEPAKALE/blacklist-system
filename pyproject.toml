[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blacklist"
version = "0.1.0"
description = "Blacklist management utility (legacy JSON CLI + FastAPI/PostgreSQL in progress)"
readme = "README.md"
requires-python = ">=3.11"


dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.141.1",
    "pydantic>=2.0.0",
    "email-validator>=2.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/core", "src/database", "src/services"]